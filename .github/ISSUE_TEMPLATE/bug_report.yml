name: Bug report
description: Something in Branchglance is wrong, missing or confusing.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please redact tokens, emails, transcripts, paths and other private information from reports and attachments.
  - type: input
    id: os
    attributes:
      label: OS and version
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options: [Installer, Source]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Branchglance version or commit
      description: Shown under Settings in the widget, or the commit you built from.
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Affected provider
      options: [Codex, Claude Code, Both, None, Not sure]
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual behaviour
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the steps or say "intermittent, no reliable repro".
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Redact tokens, emails, transcripts and private information first.
  - type: textarea
    id: debug_report
    attributes:
      label: Debug report
      description: "Settings, Report a bug, Preview debug report, Copy, then paste here. Review it first."
      render: markdown
