name: New provider
description: Suggest support for another agent tool or harness.
labels: [new-provider]
body:
  - type: markdown
    attributes:
      value: Branchglance currently works with Claude Code and Codex. Describe the tool below. Don't paste transcripts, prompts or tokens.
  - type: input
    id: tool
    attributes:
      label: Tool or harness name and version
    validations:
      required: true
  - type: textarea
    id: storage
    attributes:
      label: Where it stores sessions
      description: Folders or files, and the format if you know it. Redact personal paths.
    validations:
      required: true
  - type: textarea
    id: subagents
    attributes:
      label: How it runs subagents
      description: How a child run is started and how it links to its parent, if it does.
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: Willingness to contribute
      options:
        - I can open a pull request
        - I can test a pull request, but not write the code
        - I am requesting this only
    validations:
      required: true
