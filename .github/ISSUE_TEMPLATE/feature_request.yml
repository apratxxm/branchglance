name: Feature request
description: An idea that would make Branchglance more useful.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: To add support for another agent tool or harness, use the New provider form instead.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
