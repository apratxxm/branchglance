name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR or branch supersedes the running one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-token-tracker.txt

      - name: Install lint baseline
        run: python -m pip install ruff==0.14.4

      - name: Run checks
        run: python scripts/run_checks.py

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      # Both files are fully pinned, so audit the pins directly instead of resolving
      # Windows-only wheels on Linux.
      - name: Audit developer requirements
        run: pip-audit --no-deps --disable-pip -r requirements-token-tracker.txt

      - name: Audit Windows release pins
        run: pip-audit --no-deps --disable-pip -r packaging/requirements-release.txt
