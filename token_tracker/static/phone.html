<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Live Token Tracker roster">
  <title>Token Tracker</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/phone-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/runway.css">
  <link rel="stylesheet" href="/phone.css">
</head>
<body class="phone-roster">
  <header class="phone-settings-bar" aria-label="Phone notification settings">
    <span id="phone-setup-status" role="status" aria-live="polite">Checking alert setup…</span>
    <button id="phone-notifications" type="button" aria-describedby="phone-setup-status" disabled>Alerts</button>
  </header>
  <main class="widget">
    <header class="titlebar">
      <span id="brand" class="brand"><svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><rect x=".75" y=".75" width="10.5" height="10.5" rx="2.5"/><path d="M3.4 4.3 5.1 6 3.4 7.7M6.4 7.9h2.2"/></svg><span id="brand-name">Codex</span></span>
      <span class="tb-fill"></span>
      <button id="sync-age" class="sync-age" data-action="refresh" aria-label="Refresh roster" title="Refresh roster">Refresh</button>
      <button id="search-toggle" class="icon-btn" data-action="search" aria-label="Search chats" title="Search chats"><svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><circle cx="5.25" cy="5.25" r="3.5"/><path d="m7.9 7.9 2.6 2.6"/></svg></button>
    </header>
    <div id="notch-counts" class="notch-counts phone-counts" aria-label="Live chat counts" aria-live="polite"></div>
    <div class="layout">
      <section id="strip" class="strip" aria-label="Needs you" aria-live="polite"></section>
      <section class="resets" aria-label="Codex quota">
        <div id="resets" class="quota-grid"></div>
        <div id="runway-greeter-status" class="greeter-status muted"></div>
      </section>
      <section id="analytics" class="analytics" aria-label="Token analytics" hidden></section>
      <section class="chats" aria-label="Chats">
        <header id="chats-head" class="chats-head">
          <div class="ch-normal"><span class="ch-title">Active chats</span><span id="chat-count" class="ch-count"></span><span class="tb-fill"></span><span id="warm-rule" class="ch-rule"></span></div>
          <div class="ch-search"><svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><circle cx="5.25" cy="5.25" r="3.5"/><path d="m7.9 7.9 2.6 2.6"/></svg><input id="chat-search" type="text" spellcheck="false" autocomplete="off" placeholder="Search active chats" aria-label="Search chats and agents"><span id="result-count" class="ch-count"></span><button class="icon-btn" data-action="search-close" aria-label="Close search"><svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><path d="m3 3 6 6M9 3 3 9"/></svg></button></div>
        </header>
        <div id="chat-list" class="chat-list" aria-live="polite"></div>
      </section>
    </div>
    <div id="popover" class="popover" role="dialog" aria-modal="false" hidden></div>
    <script>
      window.__TOKEN_TRACKER_RUNWAY__ = true;
      window.__TOKEN_TRACKER_PHONE__ = true;
    </script>
    <script src="/app.js"></script>
    <script src="/phone.js" defer></script>
  </main>
</body>
</html>
