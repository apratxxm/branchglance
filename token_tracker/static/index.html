<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Token Tracker</title>
  <link rel="stylesheet" href="fonts/localfonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="widget">
    <header class="titlebar pywebview-drag-region">
      <span id="brand" class="brand"><svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><rect x=".75" y=".75" width="10.5" height="10.5" rx="2.5"/><path d="M3.4 4.3 5.1 6 3.4 7.7M6.4 7.9h2.2"/></svg><span id="brand-name">Codex</span></span>
      <button id="sync-age" class="sync-age" data-action="refresh" title="Refresh">—</button>
      <span class="tb-fill"></span>
      <button id="search-toggle" class="icon-btn" data-action="search" aria-label="Search chats" title="Search  /"><svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><circle cx="5.25" cy="5.25" r="3.5"/><path d="m7.9 7.9 2.6 2.6"/></svg></button>
      <div class="window-controls" aria-label="Window controls">
        <button id="window-minimize" aria-label="Minimize"><svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6h7"/></svg></button>
        <button id="window-fit" aria-label="Fit widget to screen" title="Fit widget to screen"><svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 5V2h3M7 10h3V7M2 2l3 3M10 10 7 7"/></svg></button>
        <button id="window-maximize" aria-label="Maximize or restore"><svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="2.5" width="7" height="7" rx="1"/></svg></button>
        <button id="window-close" aria-label="Hide to tray"><svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><path d="m3 3 6 6M9 3 3 9"/></svg></button>
      </div>
    </header>
    <div class="layout">
      <section id="strip" class="strip" aria-label="Needs attention" aria-live="polite"></section>
      <section id="resets" class="resets" aria-label="Limit resets"></section>
      <section id="analytics" class="analytics" aria-label="Token analytics" hidden></section>
      <section class="chats" aria-label="Chats">
        <header id="chats-head" class="chats-head">
          <div class="ch-normal"><span class="ch-title">Chats</span><span id="chat-count" class="ch-count"></span><span class="tb-fill"></span><span id="warm-rule" class="ch-rule"></span>
            <div id="window-seg" class="seg" role="group" aria-label="Timeline window"><span class="seg-ind" aria-hidden="true"></span><button data-action="window" data-days="1">1d</button><button data-action="window" data-days="2">2d</button><button data-action="window" data-days="5">5d</button><button data-action="window" data-days="7">7d</button></div></div>
          <div class="ch-search"><svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><circle cx="5.25" cy="5.25" r="3.5"/><path d="m7.9 7.9 2.6 2.6"/></svg><input id="chat-search" type="text" spellcheck="false" autocomplete="off" placeholder="Search · is:needs is:running is:failed" aria-label="Search chats and agents"><span id="result-count" class="ch-count"></span><button class="icon-btn" data-action="search-close" aria-label="Close search"><svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><path d="m3 3 6 6M9 3 3 9"/></svg></button></div>
        </header>
        
        <div id="chat-list" class="chat-list"></div>
      </section>
      <footer id="totals" class="totals"></footer>
    </div>
    <div id="popover" class="popover" role="dialog" hidden></div>
  </main>
  <div class="resize-edge resize-right" data-resize="right" aria-hidden="true"></div><div class="resize-edge resize-bottom" data-resize="bottom" aria-hidden="true"></div><div class="resize-edge resize-corner" data-resize="corner" aria-hidden="true"></div>
  <script src="app.js"></script>
</body>
</html>
