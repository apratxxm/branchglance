<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Branchglance · Runway</title>
  <link rel="stylesheet" href="fonts/localfonts.css">
  <link rel="stylesheet" href="runway.css">
  <link rel="stylesheet" href="runway_refined.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body class="notch-collapsed runway-refined runway-compact" data-notch-mode="controls">
  <main class="widget">
    <header class="titlebar compact-toolbar pywebview-drag-region">
      <time id="toolbar-clock" class="compact-clock" aria-label="Local time"></time>
      <span id="brand" class="brand pywebview-drag-region"><svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><rect x=".75" y=".75" width="10.5" height="10.5" rx="2.5"/><path d="M3.4 4.3 5.1 6 3.4 7.7M6.4 7.9h2.2"/></svg><span id="brand-name">Codex</span></span>
      <button id="widget-lock" class="icon-btn" data-action="widget-lock" aria-pressed="false" aria-label="Lock widget" title="Lock widget"><svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="5" width="7" height="5.5" rx="1"/><path d="M4 5V3.8a2 2 0 0 1 3.6-1.2"/></svg></button>
      <button id="widget-keep-open" class="icon-btn compact-keep-open" data-action="keep-open" aria-pressed="false" aria-label="Keep widget open" title="Keep widget open"><svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2.2 9.8 8l-1.6 1.6L2.4 3.8zM3.6 6.4 1.5 8.5l2 2 2.1-2.1M6.2 4.4l1.4-1.4"/></svg></button>
      <button id="sync-age" class="sync-age" data-action="refresh" aria-label="Refresh usage" title="Refresh usage">Now</button>
      <button id="monitor-toggle" class="sync-age" aria-label="Move to next monitor" title="Move to next monitor">Monitor</button>
      <div id="source-switch" class="source-switch" role="group" aria-label="Source" aria-busy="true"><button class="source-seg" data-action="source" data-source="Codex" aria-label="Codex" aria-pressed="true" aria-disabled="true" disabled>Codex<i class="source-dot" aria-hidden="true"></i></button><button class="source-seg" data-action="source" data-source="Claude" aria-label="Claude" aria-pressed="false" aria-disabled="true" disabled>Claude<i class="source-dot" aria-hidden="true"></i></button></div>
      <button id="dashboard-open" class="icon-btn" data-action="dashboard" aria-label="Open Insights dashboard" title="Insights"><svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 10.5h9M2.5 9V6.5M5.1 9V3.5M7.7 9V5M10.3 9V1.8"/></svg></button>
      <span class="tb-fill pywebview-drag-region"></span>
      <span id="notch-counts" class="notch-counts" aria-label="Live chat counts"></span>
      <button id="search-toggle" class="icon-btn" data-action="search" aria-label="Search chats" title="Search  /"><svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><circle cx="5.25" cy="5.25" r="3.5"/><path d="m7.9 7.9 2.6 2.6"/></svg></button>
      <div class="window-controls" aria-label="Window controls">
        <button id="window-minimize" aria-label="Minimize"><svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6h7"/></svg></button>
        <button id="window-fit" aria-label="Fit widget to screen" title="Fit widget to screen"><svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 5V2h3M7 10h3V7M2 2l3 3M10 10 7 7"/></svg></button>
        <button id="window-maximize" aria-label="Maximize or restore"><svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="2.5" width="7" height="7" rx="1"/></svg></button>
        <button id="window-close" aria-label="Hide to tray"><svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><path d="m3 3 6 6M9 3 3 9"/></svg></button>
      </div>
    </header>
    <section class="resets" aria-label="Codex quota">
      <div id="resets" class="quota-grid"></div>
      <div id="runway-greeter-status" class="greeter-status muted"></div>
    </section>
    <div id="compact-summary" class="compact-summary pywebview-drag-region" aria-label="Current time and active chats">
      <time id="compact-clock" class="compact-clock" aria-label="Local time"></time>
      <div id="compact-counts" class="compact-counts" aria-label="Current active chats"></div>
    </div>
    <div class="layout">
      <section id="strip" class="strip" aria-label="Needs you" aria-live="polite"></section>
      <section id="analytics" class="analytics" aria-label="Token analytics" hidden></section>
      <section class="chats" aria-label="Chats">
        <header id="chats-head" class="chats-head">
          <div class="ch-search"><svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><circle cx="5.25" cy="5.25" r="3.5"/><path d="m7.9 7.9 2.6 2.6"/></svg><input id="chat-search" type="text" spellcheck="false" autocomplete="off" placeholder="Search · is:needs is:running is:failed is:hidden" aria-label="Search chats and agents"><button id="hidden-chats-toggle" class="hidden-chats-toggle" data-action="show-hidden" aria-pressed="false" hidden>Show hidden</button><span id="result-count" class="ch-count"></span><button class="icon-btn" data-action="search-close" aria-label="Close search"><svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><path d="m3 3 6 6M9 3 3 9"/></svg></button></div>
        </header>
        <div id="chat-list" class="chat-list"></div>
      </section>
    </div>
    <section id="dashboard-view" class="dashboard-view" aria-label="Insights and Settings dashboard" hidden inert aria-hidden="true">
      <header class="dashboard-header">
        <div class="dashboard-heading"><span class="dashboard-eyebrow">BRANCHGLANCE / WORKSPACE</span><h1 id="dashboard-title">Insights</h1></div>
        <nav class="dashboard-tabs" role="tablist" aria-label="Dashboard sections">
          <button id="dashboard-tab-insights" class="dashboard-tab is-active" role="tab" aria-selected="true" aria-controls="dashboard-insights" data-dashboard-tab="insights">Insights</button>
          <button id="dashboard-tab-settings" class="dashboard-tab" role="tab" aria-selected="false" aria-controls="dashboard-settings" data-dashboard-tab="settings">Settings</button>
        </nav>
        <button id="dashboard-close" class="dashboard-close" data-dashboard-action="close" aria-label="Close dashboard and return to widget" title="Close dashboard"><svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><path d="m3 3 6 6M9 3 3 9"/></svg></button>
      </header>
      <div id="dashboard-content" class="dashboard-content">
        <section id="dashboard-insights" class="dashboard-panel" role="tabpanel" aria-labelledby="dashboard-tab-insights"></section>
        <section id="dashboard-settings" class="dashboard-panel" role="tabpanel" aria-labelledby="dashboard-tab-settings" hidden></section>
      </div>
      <div id="dash-tooltip" class="dash-tooltip" role="tooltip" aria-hidden="true"></div>
    </section>
    <div id="weekly-resets" class="weekly-resets" aria-label="Weekly quota"></div>
    <div id="popover" class="popover" role="dialog" hidden></div>
  </main>
  <div class="resize-edge resize-right" data-resize="right" aria-hidden="true"></div><div class="resize-edge resize-bottom" data-resize="bottom" aria-hidden="true"></div><div class="resize-edge resize-corner" data-resize="corner" aria-hidden="true"></div>
  <script>
    window.__TOKEN_TRACKER_RUNWAY__=true;
    window.__TOKEN_TRACKER_REFINED__=true;
    window.__TOKEN_TRACKER_COMPACT__=true;
    const runwayParams=new URLSearchParams(window.location.search);
    if(runwayParams.get("theme")==="classic"){window.__TOKEN_TRACKER_REFINED__=false;window.__TOKEN_TRACKER_COMPACT__=false;document.body.classList.remove("runway-refined","runway-compact");}
    if(runwayParams.get("review")==="1")window.__TOKEN_TRACKER_TEST__=true;
    if(runwayParams.get("wire")==="1")document.body.classList.add("wireframe");
  </script>
  <script src="dashboard.js"></script>
  <script src="app.js"></script>
</body>
</html>
